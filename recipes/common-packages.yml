modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ryanabx/cosmic-epoch
        - wiiznokes/cosmic-applets-unofficial
        - kordus/cosmic-applets
        - bieszczaders/kernel-cachyos-lto
    remove:
      auto-remove: false
      packages:
        - kernel
        - kernel-core
        - kernel-devel
        - kernel-devel-matched
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra
    install:
      allow-erasing: true
      # cosmic-session/cosmic-desktop hard-require these; test if exclude can override it
      exclude:
        - cosmic-term
        - cosmic-player
      packages:
        - repo: copr:copr.fedorainfracloud.org:bieszczaders:kernel-cachyos-lto
          packages:
            - kernel-cachyos-lto
            - kernel-cachyos-lto-core
            - kernel-cachyos-lto-modules
            - kernel-cachyos-lto-devel
            - kernel-cachyos-lto-devel-matched
        - llvm
        - clang
        - lld
        - cosmic-desktop
        - cosmic-app-library
        - cosmic-applets
        - cosmic-bg
        - cosmic-comp
        - cosmic-files
        - cosmic-greeter
        - cosmic-icon-theme
        - cosmic-idle
        - cosmic-initial-setup
        - cosmic-launcher
        - cosmic-notifications
        - cosmic-osd
        - cosmic-panel
        - cosmic-randr
        - cosmic-screenshot
        - cosmic-session
        - cosmic-settings
        - cosmic-settings-daemon
        - cosmic-store
        - ptyxis
        - cosmic-wallpapers
        - cosmic-workspaces
        - ibus-panel
        - ibus-xinit
        - pop-launcher
        - xdg-desktop-portal-cosmic
        - fcitx5-configtool
        - fcitx5-mozc
        - fcitx5-chinese-addons
        - fcitx5-gtk
        - fcitx5-hangul
        - kcm-fcitx5
        - cutecosmic-qt6
        - repo: copr:copr.fedorainfracloud.org:kordus:cosmic-applets
          packages:
            - cosmic-ext-applet-clipboard-manager

  # copying system files over to the system
  - type: files
    files:
      - source: system
        destination: /


  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished
        scope: system
        install:
          - dev.edfloreshz.CosmicTweaks
          - best.ellie.StartupConfiguration
          - dev.edfloreshz.Calculator
          - io.github.pixeldoted.cosmic-ext-color-picker
          - dev.heppen.webapps
          - com.jwestall.Forecast
      - scope: system
        repo: 
          url: https://apt.pop-os.org/cosmic/cosmic.flatpakrepo
          name: cosmic
          title: COSMIC flatpaks
        install: 
          - co.uk.cappsy.CosmicAppletLogoMenu
          - io.github.cosmic_utils.cosmic-ext-applet-external-monitor-brightness

  - type: systemd
    system:
      enabled:
        - cosmic-greeter

  - type: signing
